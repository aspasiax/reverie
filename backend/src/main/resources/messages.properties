# ============================================================
# Validation messages - English (default)
# ============================================================
# Key format:
# {AnnotationName}.{modelAttributeName}.{fieldName}
#
# For @Size:
# {1} = max
# {2} = min
# ============================================================


# ------------------------------------------------------------
# RegisterRequest
# ------------------------------------------------------------

NotBlank.registerRequest.username = Username is required
Size.registerRequest.username = Username must be between {2} and {1} characters

NotBlank.registerRequest.email = Email is required
Email.registerRequest.email = Email must be valid
Size.registerRequest.email = Email must not exceed {1} characters

NotBlank.registerRequest.password = Password is required
Size.registerRequest.password = Password must be between {2} and {1} characters

NotBlank.registerRequest.displayName = Display name is required
Size.registerRequest.displayName = Display name must be between {2} and {1} characters

# ------------------------------------------------------------
# LoginRequest
# ------------------------------------------------------------

NotBlank.loginRequest.email = Email is required
Email.loginRequest.email = Email must be valid

NotBlank.loginRequest.password = Password is required

# ------------------------------------------------------------
# Genre Requests
# ------------------------------------------------------------

validation.genre.name.required = Genre name is required
validation.genre.name.size = Genre name must not exceed 100 characters

validation.genre.description.size = Genre description must not exceed 500 characters
validation.genre.icon.size = Genre icon must not exceed 100 characters
validation.genre.color.size = Genre color must not exceed 20 characters
validation.genre.color.invalid = Genre color must be a valid hexadecimal value