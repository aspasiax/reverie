# Database settings
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:reverie_db}
spring.datasource.username=${PG_USER:reverie_user}
spring.datasource.password=${PG_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.flyway.baseline-on-migrate=true

# Demo migrations use a high version range, so new migrations added to the
# main chain have a lower version than the demo data already applied.
spring.flyway.out-of-order=true

# Avoid lazy loading during view rendering
spring.jpa.open-in-view=false

# Diagnostics
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

# Frontend origins
allowed.origins=http://localhost:3000,http://localhost:5173