# Database settings
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:reverie_db}
spring.datasource.username=${PG_USER:reverie_user}
spring.datasource.password=${PG_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.docker.compose.enabled=false

# JPA settings
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Avoid lazy loading during view rendering
spring.jpa.open-in-view=false

# Diagnostics
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

# Security
app.security.secret-key=${JWT_SECRET:change-this-secret-key-later}
app.security.jwt-expiration=10800000

# Frontend origins
allowed.origins=http://localhost:3000,http://localhost:5173

