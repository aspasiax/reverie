server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Set once here rather than in every location below, since nginx passes
    # these on to whichever block ends up proxying.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The API is served from the same origin as the interface, so the
    # browser never makes a cross-origin request and CORS never comes into
    # it. The address 'backend' is the service name on the compose network.
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # The API documentation is reachable from the same address, which makes
    # it usable without exposing the backend port at all.
    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
    }

    # Vite puts a content hash in every asset filename, so a given file can
    # never change. Anything that cannot change may be cached forever.
    # The directive is written out in full rather than using 'expires',
    # which would emit a second, competing Cache-Control header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The router lives in the browser. Any address that is not a file on
    # disk has to return index.html so React can decide what to render,
    # otherwise reloading /movies/... would answer 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}